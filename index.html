<!DOCTYPE html>
<html>
	<head>
		<title>three.js css3d - periodic table</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		<meta property="og:title" content="three.js css3d - periodic table">
		<meta property="og:type" content="website">
		<meta property="og:url" content="https://threejs.org/examples/css3d_periodictable.html">
		<meta property="og:image" content="https://threejs.org/examples/screenshots/css3d_periodictable.jpg">
        <script src="https://accounts.google.com/gsi/client" async defer></script>
		<script src="https://unpkg.com/papaparse@5.4.1/papaparse.min.js"></script>
		<link type="text/css" rel="stylesheet" href="main.css">
		<style>
			a {
				color: #8ff;
			}

			#menu {
				position: absolute;
				bottom: 20px;
				width: 100%;
				text-align: center;
			}

			.element {
				width: 120px;
				height: 160px;
				border-radius: 8px;
				box-shadow: 0px 4px 15px rgba(0,0,0,0.5);
				border: 1px solid rgba(255,255,255,0.15);
				font-family: Helvetica, sans-serif;
				text-align: center;
				line-height: normal;
				cursor: default;
				transition: transform 0.2s ease;
			}


			.element:hover {
				transform: scale(1.05);
				box-shadow: 0px 6px 20px rgba(0,0,0,0.7);
				border: 1px solid rgba(255,255,255,0.4);
			}

				.element .number {
					position: absolute;
					top: 15px;
					right: 20px;
					font-size: 12px;
					color: rgba(127,255,255,0.75);
				}

				.element .symbol {
					position: absolute;
					top: 115px;
					left: 0px;
					right: 0px;
					font-size: 13px;
					font-weight: bold;
					color: rgba(255,255,255,0.9);
					white-space: nowrap;
					overflow: hidden;
					text-overflow: ellipsis;
					padding: 0 5px;
				}

				.element .details {
					position: absolute;
					bottom: 15px;
					left: 0px;
					right: 0px;
					font-size: 12px;
					color: rgba(127,255,255,0.75);
				}

			button {
				position: relative;
				color: rgba(127,255,255,0.75);
				background: transparent;
				outline: 1px solid rgba(127,255,255,0.75);
				z-index: 999;
				border: 0px;
				padding: 5px 10px;
				cursor: pointer;
			}

			button:hover {
				background-color: rgba(0,255,255,0.5);
			}

			button:active {
				color: #000000;
				background-color: rgba(0,255,255,0.75);
			}
		</style>
	</head>
	<body>
		<div id="login-screen" style="position:fixed; top:0; left:0; width:100%; height:100%;
			background:#111; z-index:9999; display:flex; align-items:center; justify-content:center;">

			<div style="background:white; border-radius:12px; padding:40px 50px; text-align:center;
				box-shadow: 0px 8px 30px rgba(0,0,0,0.4); max-width:350px;">

				<h2 style="margin:0 0 10px 0; font-family: Helvetica, sans-serif; color:#222;">Welcome Back</h2>
				<p style="margin:0 0 25px 0; font-family: Helvetica, sans-serif; color:#888; font-size:14px;">
					Sign in to view the team directory
				</p>

				<div id="g_id_onload"
					data-client_id="659010836532-jr03faakt4du3s3h71m0hcrp6vuketep.apps.googleusercontent.com"
					data-callback="handleCredentialResponse"
					data-auto_prompt="false">
				</div>
				<div class="g_id_signin" data-type="standard"></div>

			</div>
		</div>


		
		<div id="user-badge" style="display:none; position:fixed; top:15px; left:15px; z-index:10000;
			background: rgba(20,20,20,0.85); border: 1px solid rgba(255,255,255,0.15);
			border-radius: 10px; padding: 8px 14px; align-items:center; gap:10px;
			font-family: Helvetica, sans-serif; box-shadow: 0px 4px 12px rgba(0,0,0,0.4);">
			<img id="user-avatar" style="width:32px; height:32px; border-radius:50%; object-fit:cover;">
			<div style="color:white; font-size:13px; line-height:1.3;">
				<div id="user-name" style="font-weight:bold;"></div>
				<div id="logout-btn" style="color:#8ff; cursor:pointer; text-decoration:underline;">Log out</div>
			</div>
		</div>
		<!-- <div id="info"><a href="https://threejs.org" target="_blank" rel="noopener">three.js</a> css3d - periodic table.</div> -->


		<div id="container">
			<div id="menu">
				<button id="table">TABLE</button>
				<button id="sphere">SPHERE</button>
				<button id="helix">HELIX</button>
				<button id="grid">GRID</button>
				<button id="tetrahedron">TETRAHEDRON</button>

				<div id="color-legend" style="display: none; position:fixed; bottom:70px; right:15px; z-index:10000;
					background: rgba(20,20,20,0.85); border: 1px solid rgba(255,255,255,0.15);
					border-radius: 10px; padding: 10px 14px; font-family: Helvetica, sans-serif;
					box-shadow: 0px 4px 12px rgba(0,0,0,0.4); color: white; font-size: 12px;">
					<div style="display:flex; justify-content:space-between; margin-bottom:4px;">
						<span style="color: #EF3022; font-family: Helvetica, sans-serif;">Lower than 100k</span>
						<span style="color: #3A9F4E; font-family: Helvetica, sans-serif;">Higher than 200k</span>
					</div>
					<div style="width:280px; height:10px; border-radius:5px;
						background: linear-gradient(90deg, #EF3022, #FDCA35, #3A9F4E);"></div>
				</div>
			</div>


			
			<script>
				function handleCredentialResponse(response) {
					const data = JSON.parse(atob(response.credential.split('.')[1]));
					sessionStorage.setItem('loggedIn', 'true');
					sessionStorage.setItem('userName', data.name);
					sessionStorage.setItem('userPicture', data.picture);

					document.getElementById('login-screen').style.display = 'none';
					document.getElementById('color-legend').style.display = 'block';
					showUserBadge(data.name, data.picture);

					console.log(data.email, data.name, data.picture);
				}

				function showUserBadge(name, picture) {
					document.getElementById('user-name').textContent = `Signed in as ${name}`;
					document.getElementById('user-avatar').src = picture;
					document.getElementById('user-badge').style.display = 'flex';
				}

				window.onload = () => {
					if (sessionStorage.getItem('loggedIn') === 'true') {
						document.getElementById('login-screen').style.display = 'none';
						document.getElementById('color-legend').style.display = 'block';
						showUserBadge(sessionStorage.getItem('userName'), sessionStorage.getItem('userPicture'));
					}

					document.getElementById('logout-btn').addEventListener('click', () => {
						sessionStorage.clear();
						document.getElementById('user-badge').style.display = 'none';
						document.getElementById('color-legend').style.display = 'none';
						document.getElementById('login-screen').style.display = 'flex';
					});
				}
			</script>

			<script type="importmap">
				{
					"imports": {
						"three": "https://unpkg.com/three@0.170.0/build/three.module.js",
						"three/addons/": "https://unpkg.com/three@0.170.0/examples/jsm/"
					}
				}
			</script>

			<script type="module">

				import * as THREE from 'three';

				import TWEEN from 'three/addons/libs/tween.module.js';
				import { TrackballControls } from 'three/addons/controls/TrackballControls.js';
				import { CSS3DRenderer, CSS3DObject } from 'three/addons/renderers/CSS3DRenderer.js';


				const dataURL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSJtO_8qCheSvXY4TOjnIPSO3grd_PrJddCRCgcw7jOJoKpbSwXeM3ImK0ycixJKO76yiEriFoWQCME/pub?output=csv';

				async function parseCSV() {
					const response = await fetch(dataURL);
					const csvText = await response.text();
					const parsed = Papa.parse(csvText, {header : true}).data;
					return parsed;
					console.log(parsed)
					console.log(response)
				}


				let camera, scene, renderer;
				let controls;

				const objects = [];
				const targets = { table: [], sphere: [], helix: [], grid: [], tetrahedron: [] };

				function getColorForNetWorth(netWorth) {
					const value = parseFloat(String(netWorth).replace(/[^0-9.-]/g, ''));

					if (value < 100000) {
						return 'linear-gradient(160deg, #7a0f0f, #EF3022)';
					}
					if (value < 200000) {
						return 'linear-gradient(160deg, #8a5a00, #FDCA35)';
					}
					return 'linear-gradient(160deg, #1d5c2c, #3A9F4E)';
				}

				init();

				async function init() {

					const people = await parseCSV();
					console.log('people:', people, 'count:', people.length);
					console.log(Object.keys(people[0]));
					camera = new THREE.PerspectiveCamera( 40, window.innerWidth / window.innerHeight, 1, 10000 );
					camera.position.z = 3000;

					scene = new THREE.Scene();


					// table
					for ( let i = 0; i < people.length; i++ ) {
						// f
						// function getColorForNetWorth(netWorth) {
						// 	let bgvalue = parseFloat(person.NetWorth);
						// 	if (bgvalue < 100000) return '#EF3022';
						// 	if (bgvalue < 200000) return '#FDCA35';
						// 	if (bgvalue > 200000) return '#3A9F4E';
						// }

						const person = people[i];

						const element = document.createElement('div');
						element.className = 'element';
						element.style.background = getColorForNetWorth(person.NetWorth);

						const country = document.createElement('div');
						country.className = 'number'; 
						country.style.left = '20px';
						country.style.right = 'auto';
						country.textContent = person.Country;
						element.appendChild(country);

						const age = document.createElement('div');
						age.className = 'number';
						age.textContent = person.Age;
						element.appendChild(age);

						const photo = document.createElement('img');
						photo.src = person.Photo;
						photo.style.width = '80px';
						photo.style.height = '80px';
						photo.style.objectFit = 'cover';
						photo.style.borderRadius = '4px';
						photo.style.marginTop = '30px';
						element.appendChild(photo);

						const name = document.createElement('div');
						name.className = 'symbol';
						name.textContent = person.Name;
						element.appendChild(name);

						const details = document.createElement('div');
						details.className = 'details';
						details.textContent = person.Interest || '';
						element.appendChild(details);

						const objectCSS = new CSS3DObject(element);
						objectCSS.position.x = Math.random() * 4000 - 2000;
						objectCSS.position.y = Math.random() * 4000 - 2000;
						objectCSS.position.z = Math.random() * 4000 - 2000;
						scene.add(objectCSS);
						objects.push(objectCSS);

						// table position (20x10 grid)
						const col = (i % 20) + 1;
						const row = Math.floor(i / 20) + 1;

						const object = new THREE.Object3D();
						object.position.x = (col * 140) - 1330;
						object.position.y = -(row * 180) + 990;
						targets.table.push(object);

					}

					// sphere

					const vector = new THREE.Vector3();

					for ( let i = 0, l = objects.length; i < l; i ++ ) {

						const phi = Math.acos( - 1 + ( 2 * i ) / l );
						const theta = Math.sqrt( l * Math.PI ) * phi;

						const object = new THREE.Object3D();

						object.position.setFromSphericalCoords( 800, phi, theta );

						vector.copy( object.position ).multiplyScalar( 2 );

						object.lookAt( vector );

						targets.sphere.push( object );

					}

					// helix (double)

					for ( let i = 0, l = objects.length; i < l; i ++ ) {

						const theta = i * 0.175 + ( i % 2 === 0 ? 0 : Math.PI ); // alternate strand offset by 180°
						const y = - ( i * 8 ) + 450;

						const object = new THREE.Object3D();

						object.position.setFromCylindricalCoords( 900, theta, y );

						vector.x = object.position.x * 2;
						vector.y = object.position.y;
						vector.z = object.position.z * 2;

						object.lookAt( vector );

						targets.helix.push( object );

					}

					// grid (5 x 4 x 10)

					for ( let i = 0; i < objects.length; i ++ ) {

						const column = i % 5;
						const row = Math.floor( i / 5 ) % 4;
						const depth = Math.floor( i / 20 ); // 5 × 4 = 20 tiles per depth layer

						const object = new THREE.Object3D();

						object.position.x = ( column * 400 ) - 800;
						object.position.y = - ( row * 400 ) + 600;
						object.position.z = ( depth * 500 ) - 2250;

						targets.grid.push( object );

					}

					// tetrahedron

					const R = 900;

					const tetraVertices = [
						new THREE.Vector3(1, 1, 1).normalize().multiplyScalar(R),
						new THREE.Vector3(1, -1, -1).normalize().multiplyScalar(R),
						new THREE.Vector3(-1, 1, -1).normalize().multiplyScalar(R),
						new THREE.Vector3(-1, -1, 1).normalize().multiplyScalar(R)
					];

					const tetraFaces = [
						[0, 1, 2],
						[0, 1, 3],
						[0, 2, 3],
						[1, 2, 3]
					];

					const perFace = Math.ceil(objects.length / 4);
					const gridRows = Math.ceil((Math.sqrt(8 * perFace + 1) - 1) / 2);

					for ( let i = 0; i < objects.length; i ++ ) {

						const perFace = Math.ceil(objects.length / 4);
						const gridRows = Math.ceil((Math.sqrt(8 * perFace + 1) - 1) / 2);

						const faceIndex = Math.floor(i / perFace) % 4;
						const indexInFace = i % perFace;

						const face = tetraFaces[faceIndex];
						const a = tetraVertices[face[0]];
						const b = tetraVertices[face[1]];
						const c = tetraVertices[face[2]];

						// walk a triangular grid to get a row/col for this tile within the face
						let row = 0, count = 0;
						while (count + row + 1 <= indexInFace) {
							count += row + 1;
							row++;
						}
						const col = indexInFace - count;

						const v = gridRows > 1 ? row / (gridRows - 1) : 0;
						const u = row > 0 ? col / row : 0;

						// barycentric interpolation across the triangle a-b-c
						const p1 = new THREE.Vector3().lerpVectors(a, b, v);
						const p2 = new THREE.Vector3().lerpVectors(a, c, v);
						const point = new THREE.Vector3().lerpVectors(p1, p2, u);

						const object = new THREE.Object3D();
						object.position.copy(point);
						object.lookAt(point.clone().multiplyScalar(2)); // face outward, like your sphere tiles do

						targets.tetrahedron.push(object);
					}

					//

					renderer = new CSS3DRenderer();
					renderer.setSize( window.innerWidth, window.innerHeight );
					document.getElementById( 'container' ).appendChild( renderer.domElement );

					//

					controls = new TrackballControls( camera, renderer.domElement );
					controls.minDistance = 500;
					controls.maxDistance = 6000;
					controls.addEventListener( 'change', render );

					const buttonTable = document.getElementById( 'table' );
					buttonTable.addEventListener( 'click', function () {

						transform( targets.table, 2000 );

					} );

					const buttonSphere = document.getElementById( 'sphere' );
					buttonSphere.addEventListener( 'click', function () {

						transform( targets.sphere, 2000 );

					} );

					const buttonHelix = document.getElementById( 'helix' );
					buttonHelix.addEventListener( 'click', function () {

						transform( targets.helix, 2000 );

					} );

					const buttonGrid = document.getElementById( 'grid' );
					buttonGrid.addEventListener( 'click', function () {

						transform( targets.grid, 2000 );

					} );

					const buttonTetrahedron = document.getElementById( 'tetrahedron' );
					buttonTetrahedron.addEventListener( 'click', function () {

						transform( targets.tetrahedron, 2000 );

					} );

					transform( targets.table, 2000 );

					//

					window.addEventListener( 'resize', onWindowResize );

					animate();
				}

				function transform( targets, duration ) {

					TWEEN.removeAll();

					for ( let i = 0; i < objects.length; i ++ ) {

						const object = objects[ i ];
						const target = targets[ i ];

						new TWEEN.Tween( object.position )
							.to( { x: target.position.x, y: target.position.y, z: target.position.z }, Math.random() * duration + duration )
							.easing( TWEEN.Easing.Exponential.InOut )
							.start();

						new TWEEN.Tween( object.rotation )
							.to( { x: target.rotation.x, y: target.rotation.y, z: target.rotation.z }, Math.random() * duration + duration )
							.easing( TWEEN.Easing.Exponential.InOut )
							.start();

					}

					new TWEEN.Tween( this )
						.to( {}, duration * 2 )
						.onUpdate( render )
						.start();

				}

				function onWindowResize() {

					camera.aspect = window.innerWidth / window.innerHeight;
					camera.updateProjectionMatrix();

					renderer.setSize( window.innerWidth, window.innerHeight );

					render();

				}

				function animate() {

					requestAnimationFrame( animate );

					TWEEN.update();

					controls.update();

				}

				function render() {

					renderer.render( scene, camera );

				}

			</script>
		</div>
	</body>
</html>
